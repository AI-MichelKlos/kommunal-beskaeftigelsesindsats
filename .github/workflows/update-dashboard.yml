name: Update kommunalt dashboard
run-name: "Kommunalt dashboard - ${{ github.event_name }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_dashboard.py"
      - "scripts/validate_dashboard.py"
      - "index.html"
      - ".github/workflows/update-dashboard.yml"
  schedule:
    - cron: "27 7-11 * * *"

permissions:
  contents: write

concurrency:
  group: update-kommunalt-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Afgør om dagens kørsel er nødvendig
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(TZ=Europe/Copenhagen date +'%F')"
          hour="$(TZ=Europe/Copenhagen date +'%H')"
          hour=$((10#$hour))
          if [ "$hour" -lt 9 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif grep -Fxq "status: ok" status/last-run.txt 2>/dev/null && grep -Fxq "dato_dk: $today" status/last-run.txt 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Kør dataopdatering
        if: steps.gate.outputs.run == 'true'
        id: update
        shell: bash
        run: |
          mkdir -p status
          today="$(TZ=Europe/Copenhagen date +'%F')"
          started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ -z "$JOBINDSATS_API_TOKEN" ]; then
            printf 'status: fejl\ntid_utc: %s\ndato_dk: %s\ntrin: secret\nfejl: API_ADGANG mangler eller er tomt\n' "$started" "$today" > status/last-run.txt
            echo "code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python -m py_compile scripts/update_dashboard.py scripts/validate_dashboard.py > status/run.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then python scripts/update_dashboard.py >> status/run.log 2>&1; code=$?; fi
          if [ "$code" -eq 0 ]; then python scripts/validate_dashboard.py >> status/run.log 2>&1; code=$?; fi
          set -e
          cat status/run.log || true
          if [ "$code" -ne 0 ]; then
            message="$(tail -n 10 status/run.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
            printf 'status: fejl\ntid_utc: %s\ndato_dk: %s\ntrin: opdatering\nfejl: %s\n' "$started" "$today" "$message" > status/last-run.txt
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Gem data og status
        if: steps.gate.outputs.run == 'true' && always()
        shell: bash
        run: |
          git add data/dashboard-data.json status/last-run.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Kommunalt dashboard automation"
          git config user.email "kommunalt-dashboard-automation@users.noreply.github.com"
          git commit -m "Opdater kommunalt dashboarddata og status"
          git push
      - name: Markér fejl
        if: steps.gate.outputs.run == 'true' && steps.update.outputs.code != '0'
        run: exit 1

# Første verificerede API-test efter tilføjelse af API_ADGANG: 2026-08-18
