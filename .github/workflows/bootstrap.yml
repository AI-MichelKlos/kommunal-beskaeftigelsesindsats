name: Bootstrap kommunalt dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pak dashboardfiler ud
        shell: bash
        run: |
          cat > /tmp/payload.b64 <<'PAYLOAD'



PAYLOAD
          base64 -d /tmp/payload.b64 | tar -xzf - -C .
          rm -f .github/workflows/bootstrap.yml
          python -m py_compile scripts/update_dashboard.py scripts/validate_dashboard.py
          if [ -n "$JOBINDSATS_API_TOKEN" ]; then
            python scripts/update_dashboard.py || true
          else
            printf 'status: fejl\ntid_utc: %s\ndato_dk: %s\ntrin: secret\nfejl: API_ADGANG mangler eller er tomt\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$(TZ=Europe/Copenhagen date +'%F')" > status/last-run.txt
          fi
          python scripts/validate_dashboard.py
      - name: Gem første dashboardversion
        shell: bash
        run: |
          git add -A
          git config user.name "Kommunalt dashboard bootstrap"
          git config user.email "kommunalt-dashboard-bootstrap@users.noreply.github.com"
          git commit -m "Byg første version af kommunalt beskæftigelsesdashboard"
          git push
